
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | DopeForChristCollection</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    .shop-button {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    color: #d4af37;
    border: 1px solid #d4af37;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.shop-button:hover {
    background: #d4af37;
    color: #080808;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    transform: translateY(-3px);
}

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 30px 20px;
      background:
        radial-gradient(ellipse at 50% 40%, #30230f 0%, #111 40%, #050505 80%);
    }

    /* Background video */
    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      filter: brightness(0.55);
    }

    /* Dark overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.65),
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.85)
      );
    }

    /* Animated gold lighting */
    .gold-light {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: #c99a3d;
      filter: blur(150px);
      opacity: 0.15;
      animation: glow 6s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        transform: translate(-100px, -40px);
        opacity: 0.08;
      }
      to {
        transform: translate(100px, 40px);
        opacity: 0.22;
      }
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 850px;
      animation: appear 1.5s ease forwards;
    }

    .cross {
      color: #d4a853;
      font-size: 40px;
      margin-bottom: 14px;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(22px, 4vw, 36px);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 10px;
      letter-spacing: 6px;
      color: #d4a853;
      margin-bottom: 65px;
    }

    .coming {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(75px, 15vw, 160px);
      line-height: 0.85;
      letter-spacing: 5px;
    }

    .soon {
      display: block;
      color: #d4a853;
      font-size: clamp(85px, 17vw, 180px);
      letter-spacing: 3px;
      margin-top: 12px;
      animation: shine 3s ease-in-out infinite alternate;
    }

    @keyframes shine {
      from {
        text-shadow: 0 0 5px #d4a853;
      }
      to {
        text-shadow: 0 0 35px #d4a853;
      }
    }

    .message {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 4px;
      line-height: 2;
      color: #ccc;
    }

    .line {
      width: 70px;
      height: 2px;
      background: #d4a853;
      margin: 30px auto;
    }

    .footer {
      position: absolute;
      bottom: 28px;
      left: 20px;
      right: 20px;
      z-index: 2;
      text-align: center;
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .tagline {
        margin-bottom: 50px;
        letter-spacing: 3px;
      }

      .message {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .brand {
        letter-spacing: 2px;
      }
      
    }
  </style>
</head>

<body>
  <main class="hero">

    <video
      class="background-video"
      autoplay
      muted
      loop
      playsinline
      poster=""
    >
      <source src="videos/coming-soon.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>
    <div class="gold-light"></div>

    <div class="content">
      <div class="cross">✝</div>

      <div class="brand">DOPEFORCHRISTCOLLECTION</div>
      <div class="tagline">FAITH MEETS FASHION</div>

      <h1 class="coming">
        COMING
        <span class="soon">SOON</span>
      </h1>

      <p class="message">
        SOMETHING BEAUTIFUL IS ON THE WAY.
        <br>
        WALK BY FAITH. WEAR YOUR PURPOSE.
      </p>

      <a href="shop.html" class="shop-button">
    <span>←</span> BACK TO SHOP
</a>

      <div class="line"></div>
    </div>

    <footer class="footer">
      © 2026 DOPEFORCHRISTCOLLECTION · ALL RIGHTS RESERVED
    </footer>

  </main>
</body>
</html>
