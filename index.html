<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DopeForChristCollection</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 1em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background-image: url('https://images.unsplash.com/photo-1503341504253-dff4815485f1?q=80&w=800&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            text-align: center;
            color: #fff;
        }

        .hero h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #e67e22;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #d35400;
        }

        .products {
            padding: 40px 20px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .card h3 {
            margin-bottom: 10px;
        }
        .card p {
            font-size: 1.1em;
            color: #e67e22;
        }
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>
      <header>
        <div class="logo">DopeForChristCollection</div>

        <nav>
            <a href="index.html">Edition One</a>
            <a href="Edition2.html">Edition Two</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Faith Meets Fashion</h1>
            <p>Wear your faith boldly with DopeForChristCollection.</p>

            <a href="#products" class="btn">Shop Edition One</a>
        </div>
    </section>

    <section class="products" id="products">
        <h2>Edition One</h2>

        <div class="product-grid">

         

    <a href="Payment.html" class="btn">
      Buy Now
    </a>
</div>

<div class="card">
    <img src="https://images.unsplash.com/photo-1503341504253-dff4815485f1?q=80&w=800&auto=format&fit=crop" alt="Christian T-shirt">

    <h3>Jesus Saves Tee</h3>

    <p>KES 2,000</p>

    <a href="Payment.html" class="btn">
      Buy Now
    </a>
</div>

<div class="card">
    <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=800&auto=format&fit=crop" alt="Christian Jacket">

    <h3>Chosen Jacket</h3>

    <p>KES 4,500</p>

    <a href="Payment.html" class="btn">
      Buy Now
    </a>
</div>

        </div>
    </section>

    <footer>
        <p>© 2026 DopeForChristCollection | All Rights Reserved</p>
    </footer>

</body>
</html>
</body>
</html>
