<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment | DopeForChrist</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
 
  <style>
    :root {
      --gold: #f0c040;
      --gold-light: #ffe88a;
      --gold-dim: #b8942e;
      --bg: #0d0d0d;
      --card: #161616;
      --surface: #1e1e1e;
      --border: rgba(240,192,64,0.15);
      --text: #e8e8e8;
      --muted: #888;
      --error: #ff5f5f;
      --success: #4cde8c;
    }
 
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }
 
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(240,192,64,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
 
    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 10;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); color: var(--gold); }
 
    .payment-box {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    }
 
    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    .card-header {
      background: linear-gradient(135deg, #1a1400 0%, #0d0d0d 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 32px 24px;
      text-align: center;
      position: relative;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
    }
 
    .product-details {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-name { font-size:15px; font-weight:700; color:var(--text); }
    .product-sub  { font-size:12px; color:var(--muted); margin-top:2px; }
    .price-tag    { text-align:right; }
    .price-tag .amount   { font-family:'Cinzel',serif; font-size:22px; font-weight:700; color:var(--gold); }
    .price-tag .currency { font-size:12px; color:var(--muted); letter-spacing:1px; }
 
    .form-body { padding: 28px 32px 32px; }
 
    .field { margin-bottom: 18px; }
 
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
 
    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #444; }
    input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 3px rgba(240,192,64,0.08); }
    input.error { border-color: var(--error); }
 
    .field-hint { font-size:11px; color:var(--muted); margin-top:5px; }
 
    .pay-btn {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      color: #000;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .pay-btn:not(:disabled):hover {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(240,192,64,0.3);
    }
    .pay-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
 
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .status-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
 
    .status-msg.error   { display:block; background:rgba(255,95,95,0.1); border:1px solid rgba(255,95,95,0.3); color:var(--error); }
    .status-msg.success { display:block; background:rgba(76,222,140,0.1); border:1px solid rgba(76,222,140,0.3); color:var(--success); }
 
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #444;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
 
<body>
 
  <button class="back-btn" onclick="window.location.href='index.html'">&#8592; Back</button>
 
  <div class="payment-box">
 
    <div class="card-header">
      <p class="brand">DopeForChrist</p>
      <h1>Complete Payment</h1>
    </div>
 
    <div class="product-details">
      <div>
        <div class="product-name" id="productName">Loading...</div>
        <div class="product-sub">1 item</div>
      </div>
      <div class="price-tag">
        <div class="currency">KES</div>
        <div class="amount" id="productPrice">0</div>
      </div>
    </div>
 
    <div class="form-body">
      <form id="paymentForm">
 
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required />
        </div>
 
        <div class="field">
          <label for="phone">M-Pesa Phone Number</label>
          <input type="tel" id="phone" placeholder="0712 345 678" required />
          <p class="field-hint">Enter the number registered with M-Pesa</p>
        </div>
 
        <button type="submit" class="pay-btn" id="payBtn">PAY NOW</button>
 
      </form>
 
      <div class="status-msg" id="statusMsg"></div>
 
      <p class="note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Secured via Safaricom M-Pesa
      </p>
    </div>
 
  </div>
 
  <script>
    // 1. Load product info from URL
    const params       = new URLSearchParams(window.location.search);
    const productName  = params.get("name")  || "Item";
    const productPrice = params.get("price") || "0";
 
    document.getElementById("productName").innerText  = productName;
    document.getElementById("productPrice").innerText = productPrice;
 
    // 2. Phone formatter — accepts 07xx, 01xx, 254xx, +254xx
    function formatPhone(raw) {
      let p = raw.trim().replace(/[\s\-()]/g, "");
      if (p.startsWith("+"))                          p = p.slice(1);
      if (p.startsWith("07") || p.startsWith("01"))   p = "254" + p.slice(1);
      return p;
    }
 
    function isValidPhone(p) {
      return /^254[17]\d{8}$/.test(p);
    }
 
    // 3. Status helpers
    function showStatus(msg, type) {
      const el = document.getElementById("statusMsg");
      el.className = "status-msg " + type;
      el.innerHTML = msg;
    }
    function clearStatus() {
      const el = document.getElementById("statusMsg");
      el.className = "status-msg";
      el.innerHTML = "";
    }
 
    // 4. Submit handler
    document.getElementById("paymentForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      clearStatus();
 
      const phoneInput     = document.getElementById("phone");
      const payBtn         = document.getElementById("payBtn");
      const formattedPhone = formatPhone(phoneInput.value);
 
      // Validate
      if (!isValidPhone(formattedPhone)) {
        phoneInput.classList.add("error");
        showStatus("&#10060; Invalid number. Use your M-Pesa number e.g. <strong>0712345678</strong>", "error");
        return;
      }
      phoneInput.classList.remove("error");
 
      // Loading state
      payBtn.disabled  = true;
      payBtn.innerHTML = '<span class="spinner"></span> Processing...';
 
      try {
        const response = await fetch(
          "https://dope-for-christ-collection-git-main-kihotonjenga-arts-projects.vercel.app/stkpush",
          {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone:   formattedPhone,
              amount:  productPrice,
              product: productName
            })
          }
        );
 
        if (!response.ok) {
          const errText = await response.text();
          throw new Error("Server error " + response.status + ": " + errText);
        }
 
        const data = await response.json();
 
        if (data.success) {
          showStatus(
            "&#9989; <strong>STK Push sent!</strong> Check your phone and enter your M-Pesa PIN to complete payment.",
            "success"
          );
          payBtn.innerHTML = "&#10003; REQUEST SENT";
          // Keep disabled — prevents double payment
        } else {
          showStatus("&#10060; " + (data.message || "Payment request failed."), "error");
          payBtn.disabled  = false;
          payBtn.innerHTML = "PAY NOW";
        }
 
      } catch (err) {
        console.error("Payment error:", err);
        let msg = err.message;
        if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
          msg = "Could not reach payment server. Check your internet and try again.";
        }
        showStatus("&#10060; " + msg, "error");
        payBtn.disabled  = false;
        payBtn.innerHTML = "PAY NOW";
      }
    });
 
    // Clear error styling on type
    document.getElementById("phone").addEventListener("input", function () {
      this.classList.remove("error");
      clearStatus();
    });
  </script>
 
</body>
</html>
